services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - sim-data:/app/data
      # Required for the app to watch the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Needed to read Restic/Borg/rsync marker files (the External Backup Jobs feature).
      # Mount the host path where marker files live at the SAME path inside the container.
      - /mnt:/mnt:ro
    environment:
      - DATA_DIR=/app/data
    restart: unless-stopped

volumes:
  sim-data:
